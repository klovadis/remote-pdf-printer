[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-pdf-printer"
version = "0.1.0"
description = "Nimmt PDFs der Firefox-Erweiterung entgegen, klassifiziert sie, legt sie ab und druckt sie per CUPS."
requires-python = ">=3.11"
dependencies = ["pypdf>=3.9"]

[project.optional-dependencies]
test = ["pytest>=7"]

[project.scripts]
remote-pdf-printer = "remote_pdf_printer.__main__:main"

[tool.setuptools.packages.find]
include = ["remote_pdf_printer*"]
