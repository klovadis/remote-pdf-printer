# Konfiguration des Remote-PDF-Druckservers
# Kopieren und anpassen:
#   Linux:   /etc/remote-pdf-printer/config.toml
#   Windows: C:\ProgramData\remote-pdf-printer\config.toml
# Relative Pfade beziehen sich auf den Ordner dieser Datei.
# Windows-Pfade in einfachen Anführungszeichen schreiben, z.B.  dir = 'D:\Praxis\PDF'

[server]
# Der Server spricht nur unverschlüsseltes HTTP (kein HTTPS).
# "127.0.0.1" = nur vom selben Rechner erreichbar. Damit ein Browser auf einem anderen PC ihn erreicht,
# "0.0.0.0" (alle Netzwerkkarten) oder die LAN-Adresse dieses Rechners eintragen.
host = "127.0.0.1"
port = 8080
# Geheimes Token (mind. 16 Zeichen), muss auch in der Browser-Erweiterung eingetragen werden.
# Erzeugen z.B. mit:  python3 -c "import secrets; print(secrets.token_urlsafe(32))"
api_token = "BITTE-AENDERN-mindestens-16-zeichen"
# Optional: nur diese Rechner/Netze dürfen PDFs schicken (leer = alle, Token ist trotzdem Pflicht).
allowed_clients = ["192.168.0.0/16", "127.0.0.1"]
max_upload_mb = 50

[storage]
# Basisordner; jede Kategorie legt in einem Unterordner davon ab.
# Windows z.B.:  dir = 'C:\Remote-PDF'
dir = "/srv/remote-pdf"
# Platzhalter: {date} {time} {timestamp} {category} {name} (= ursprünglicher Dateiname)
filename_template = "{date}_{time}_{category}_{name}"

[printing]
# "auto": unter Windows SumatraPDF, sonst CUPS. Oder fest "cups" bzw. "sumatra".
# Installierte Drucker anzeigen:  remote-pdf-printer -c config.toml printers
backend = "auto"
# CUPS: Druckbefehl
lp_command = "lp"
# Windows: Pfad zu SumatraPDF.exe (https://www.sumatrapdfreader.org). Weglassen = Standardorte durchsuchen.
# sumatra_path = 'C:\Program Files\SumatraPDF\SumatraPDF.exe'

[classification]
# Wie viele Seiten für die Textsuche gelesen werden
text_pages = 3
# Kategorie, wenn keine Regel passt
default_category = "a4"

# ---------------------------------------------------------------------------------------
# Kategorien: was mit einem Dokument passiert.
#   folder  = Unterordner zum Ablegen (weglassen = nicht ablegen)
#   browser = "suppress": Firefox zeigt/druckt das PDF nicht mehr selbst
#             "show":     Firefox verhält sich wie bisher (anzeigen/herunterladen/drucken)
#   [categories.X.print] = drucken (weglassen = nicht drucken):
#       printer     = Druckername, genau wie bei "printers" angezeigt
#       paper       = "A3" | "A4" | "A5" | "A6" | "Letter" | "Legal"  (weglassen = Druckerstandard)
#       scaling     = "fit" (an Seite anpassen) | "shrink" (nur verkleinern) | "none"
#       orientation = "auto" | "portrait" | "landscape"
#       duplex      = "none" | "long" | "short"  (weglassen = Druckerstandard)
#       copies      = 1
#       options          = ["..."]  zusätzliche CUPS-Optionen (lp -o), nur Linux
#       sumatra_settings = ["..."]  zusätzliche SumatraPDF-Druckeinstellungen, nur Windows (z.B. "bin=2")
# Schlägt Ablegen oder Drucken fehl, zeigt Firefox das PDF immer normal an.
# ---------------------------------------------------------------------------------------

[categories.rezept]
label = "Rezept (A6)"
folder = "rezepte"
browser = "suppress"
[categories.rezept.print]
printer = "Rezeptdrucker"
paper = "A6"
scaling = "fit"
copies = 1

[categories.rechnung]
label = "Rechnung"
# Dieser Ordner kann vom Rechnungsprogramm überwacht werden.
folder = "rechnungen"
browser = "suppress"

[categories.befund]
label = "Befund / Arztbrief"
folder = "befunde"
browser = "show"

[categories.a4]
label = "A4-Dokument"
folder = "a4"
browser = "suppress"
[categories.a4.print]
printer = "A4-Drucker"
paper = "A4"
scaling = "fit"
duplex = "none"

# ---------------------------------------------------------------------------------------
# Regeln: werden der Reihe nach geprüft, die erste passende gewinnt.
# Alle angegebenen Bedingungen einer Regel müssen zutreffen. Mögliche Bedingungen:
#   page_size  = "A4" | "A5" | "A6" | [Breite, Höhe] in mm (Hoch/Quer egal)
#   size_tolerance_mm = 6
#   text_any   = ["Regex", ...]   mindestens einer muss im Text vorkommen
#   text_all   = ["Regex", ...]   alle müssen vorkommen
#   text_none  = ["Regex", ...]   keiner darf vorkommen
#   filename   = "Regex"          auf den ursprünglichen Dateinamen
#   url        = "Regex"          auf die URL der Seite, aus der das PDF stammt
#   min_pages / max_pages
# Groß-/Kleinschreibung wird ignoriert. Testen ohne zu drucken:
#   remote-pdf-printer -c config.toml classify beispiel.pdf
# ---------------------------------------------------------------------------------------

[[rules]]
category = "rezept"
page_size = "A6"

[[rules]]
category = "rechnung"
text_any = ["Rechnungsnummer", "Rechnungs-?Nr", "\\bRechnung\\b", "Liquidation", "Quittung"]

[[rules]]
category = "befund"
text_any = ["Arztbrief", "\\bBefund", "Laborbefund", "Entlassungsbericht"]
