<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Remote PDF Printer – Einstellungen</title>
  <link rel="stylesheet" href="../ui.css">
</head>
<body class="page">
  <h1>Remote PDF Printer</h1>
  <form id="form">
    <label>Server-Adresse
      <input id="serverUrl" type="url" placeholder="https://druckserver.local" required>
    </label>
    <label>API-Token (wie <code>api_token</code> in der config.toml)
      <input id="token" type="password" autocomplete="off" required minlength="16">
    </label>
    <label>Aktiv auf diesen Websites (eine Domain pro Zeile, <code>*.example.org</code> für alle Subdomains)
      <textarea id="domains" rows="4" spellcheck="false" placeholder="app.example.org"></textarea>
    </label>
    <label class="check"><input id="enabled" type="checkbox"> PDFs abfangen und an den Server senden</label>
    <label>Benachrichtigungen
      <select id="notify">
        <option value="all">bei jedem Dokument</option>
        <option value="errors">nur bei Fehlern</option>
        <option value="none">keine</option>
      </select>
    </label>
    <label class="check"><input id="captureForeign" type="checkbox">
      Auch PDFs abfangen, die diese Websites von anderen Domains laden (erfordert Zugriff auf alle Websites)</label>
    <label class="check"><input id="debug" type="checkbox">
      Debug-Modus (ausführliche Meldungen – Firefox: Browser-Konsole, Strg+Umschalt+J;
      Chrome: F12 auf der jeweiligen Seite und „Service Worker“ unter chrome://extensions)</label>
    <div class="buttons">
      <button type="submit">Speichern</button>
      <button type="button" id="test">Verbindung testen</button>
    </div>
  </form>
  <pre id="status" class="status" hidden></pre>
  <script src="../common/domains.js"></script>
  <script src="options.js"></script>
</body>
</html>
